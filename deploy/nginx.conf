# Static hosting example. Replace the domain and document root before use.
# Configure the public HTTPS endpoint and certificates in your server panel,
# reverse proxy, or Nginx TLS configuration.
server {
    listen 80;
    server_name music.example.com;

    root /var/www/sonic-relics;
    index index.html;
    charset utf-8;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite asset filenames include a content hash.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Keep missing audio, artwork, and icons from returning the HTML fallback.
    location ~ ^/(audio|artworks|icons)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
